services:
  - type: web
    name: v2-ecosystem-backend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    numRetries: 3
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: INSTALL_ENABLED
        value: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # SECURITY: set these once via the Render dashboard using offline-generated secrets.
      # generateValue: true would rotate them on every deploy, logging out all users.
      # Generate: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://v2-ecosystem.vercel.app
      - key: CORS_ORIGINS
        value: https://v2-ecosystem.vercel.app
      - key: API_URL
        sync: false
