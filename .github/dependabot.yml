version: 2
updates:
  # The repository has a root package.json used by E2E and CI tooling.
  # Keep it monitored separately from the backend and frontend applications.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "root"
    groups:
      root-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    # Express 5 is an isolated migration project; keep the production API on
    # the Express 4 line until route-layer no-mock coverage and permission-model
    # decisions are complete.
    ignore:
      - dependency-name: "express"
        versions: [">=5.0.0"]
      - dependency-name: "@types/express"
        versions: [">=5.0.0"]
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
