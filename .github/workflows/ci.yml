name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

env:
  NODE_VERSION: '20.x'

jobs:
  quality-gate:
    name: Stage 1 - Quality Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit
      
      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

  backend-unit:
    name: Stage 2 - Backend Unit
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Run unit tests
        working-directory: backend
        run: npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key
      
      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend-unit:
    name: Stage 2 - Frontend Unit
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run unit tests
        working-directory: frontend
        run: npm test
        env:
          NODE_ENV: test

      - name: Run critical route coverage gate
        working-directory: frontend
        run: npm run test:cov:critical
        env:
          NODE_ENV: test

      - name: Upload frontend coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
            frontend/coverage-critical/
          retention-days: 7

  backend-integration:
    name: Stage 3 - Backend Integration
    runs-on: ubuntu-latest
    needs: backend-unit
    # Use supabase/postgres image directly as a service — avoids 'supabase start'
    # which fails in this runner environment. supabase/postgres:15.x includes all
    # Supabase extensions (pgcrypto, uuid-ossp, auth schema, etc.).
    services:
      supabase-db:
        image: supabase/postgres:15.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis-test:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply database migrations
        run: |
          # psql comes pre-installed on ubuntu-latest
          export DB_URL="postgresql://postgres:postgres@localhost:15432/postgres"
          # Grant BYPASSRLS to postgres superuser so the seed step can INSERT
          # through RLS policies that require auth.uid() (which returns NULL in
          # plain-Postgres CI — only Supabase GoTrue sets it via JWT claims).
          psql "$DB_URL" -c "ALTER ROLE postgres BYPASSRLS;" 2>&1 || true
          echo "Applying $( ls supabase/migrations/*.sql | wc -l ) migration files..."
          for f in $(ls supabase/migrations/*.sql | sort); do
            case "$f" in
              *DUPLICATE*) echo "Skipping duplicate: $f"; continue ;;
            esac
            echo "  -> $f"
            psql "$DB_URL" -f "$f" 2>&1 || echo "  (non-fatal, continuing)"
          done
          echo "Migrations done."

      - name: Start PostgREST
        run: |
          docker run -d --name postgrest \
            --network host \
            -e PGRST_DB_URI="postgresql://postgres:postgres@localhost:15432/postgres" \
            -e PGRST_DB_SCHEMA="public" \
            -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_JWT_SECRET="super-secret-jwt-token-with-at-least-32-characters-long" \
            -e PGRST_SERVER_PORT="15421" \
            postgrest/postgrest:latest

          echo "Waiting for PostgREST on :15421..."
          for i in $(seq 1 12); do
            if curl -sf http://127.0.0.1:15421/ >/dev/null 2>&1; then
              echo "PostgREST ready (attempt $i)"; break
            fi
            [ $i -eq 12 ] && { echo "PostgREST timed out"; docker logs postgrest; exit 1; }
            sleep 5
          done

          # nginx proxy: translates /rest/v1/* -> PostgREST root
          # @supabase/supabase-js v2 always appends /rest/v1 to the base URL,
          # so we expose :15420 as the Supabase-compatible base URL.
          sudo apt-get install -y nginx -q
          printf 'server {\n  listen 15420;\n  location /rest/v1/ {\n    proxy_pass http://127.0.0.1:15421/;\n    proxy_set_header Host $host;\n  }\n  location / {\n    return 404;\n  }\n}\n' > /tmp/nginx-postgrest.conf
          sudo cp /tmp/nginx-postgrest.conf /etc/nginx/conf.d/postgrest.conf
          sudo nginx -t
          sudo systemctl restart nginx
          echo "nginx proxy ready on :15420 -> PostgREST :15421"

      - name: Set Supabase env vars
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:15420" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTcwMDAwMDAwMCwiZXhwIjo5OTk5OTk5OTk5fQ.tM2Q6u7jTiD0lxqqYkR-xZFHD3OUWJE0cFw5y_ZwTMA" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjk5OTk5OTk5OTl9.CvRO64tTDIEplrwz04VrlDVJy1RFA0yDr2O-ofo9ZdI" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjk5OTk5OTk5OTl9.CvRO64tTDIEplrwz04VrlDVJy1RFA0yDr2O-ofo9ZdI" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:15432/postgres" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:15432/postgres" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          REDIS_URL: redis://127.0.0.1:6380
          TEST_REDIS_URL: redis://127.0.0.1:6380

      - name: Upload integration results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results
          path: backend/test-results/
          retention-days: 7

  build:
    name: Stage 4 - Build
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: Build backend
        working-directory: backend
        run: npm run build
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  e2e-smoke:
    name: Stage 5 - E2E Smoke
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: .
        run: npx playwright install --with-deps chromium
      
      - name: Start backend and frontend
        working-directory: .
        run: |
          npm run dev > /tmp/v2-ecosystem-dev.log 2>&1 &
          echo "Started app services"

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1 && (curl -fsS http://localhost:3005/api/health >/dev/null 2>&1 || curl -fsS http://localhost:3005/api/healthz >/dev/null 2>&1); then
              echo "Services are up"
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time"
          cat /tmp/v2-ecosystem-dev.log || true
          exit 1

      - name: Run smoke Playwright tests
        working-directory: .
        run: npx playwright test -c playwright.all.config.ts --project=chromium --grep "@smoke"
        env:
          CI: true
          E2E_CUSTOMER_EMAIL: e2e.customer@test.com
          E2E_CUSTOMER_PASSWORD: TestPass123!
          E2E_ADMIN_EMAIL: admin@v2ecosystem.com
          E2E_ADMIN_PASSWORD: admin123
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-phase3:
    name: Stage 5.5 - Phase 3 Coverage
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: Start backend and frontend
        working-directory: .
        run: |
          npm run dev > /tmp/v2-ecosystem-dev.log 2>&1 &
          echo "Started app services"

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1 && (curl -fsS http://localhost:3005/api/health >/dev/null 2>&1 || curl -fsS http://localhost:3005/api/healthz >/dev/null 2>&1); then
              echo "Services are up"
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time"
          cat /tmp/v2-ecosystem-dev.log || true
          exit 1

      - name: Run Phase 3 critical-path specs (PR)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: >
          npx playwright test -c playwright.config.ts
          tests/phase3/00-public-pages.spec.ts
          tests/phase3/01-engine-a-instant-transactions.spec.ts
          tests/phase3/02-engine-b-reservations.spec.ts
          tests/phase3/03-engine-c-capacity.spec.ts
          tests/phase3/04-engine-d-entitlements.spec.ts
          tests/phase3/24-journey-cross-engine.spec.ts
          --project=chromium
        env:
          CI: true

      - name: Run full Phase 3 suite (Nightly/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: npx playwright test -c playwright.config.ts --project=chromium
        env:
          CI: true

      - name: Upload Phase 3 artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-phase3-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-full-nightly:
    name: Stage 6 - Full E2E (Main/Nightly)
    runs-on: ubuntu-latest
    needs: [build, backend-integration]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: Start backend and frontend
        working-directory: .
        run: |
          npm run dev > /tmp/v2-ecosystem-dev.log 2>&1 &
          echo "Started app services"

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1 && curl -fsS http://localhost:3005/api/healthz >/dev/null 2>&1; then
              echo "Services are up"
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time"
          cat /tmp/v2-ecosystem-dev.log || true
          exit 1

      - name: Run full Playwright suite
        working-directory: .
        run: npx playwright test -c playwright.all.config.ts --project=chromium
        env:
          CI: true

      - name: Upload full E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-full-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, backend-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy frontend to Vercel (staging)
        working-directory: frontend
        continue-on-error: true
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN not set in runner environment, skipping Vercel deploy"
            exit 0
          fi
          vercel deploy --token="$VERCEL_TOKEN" --confirm

      - name: Deploy backend to Render
        continue-on-error: true
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deploy hook triggered"
          else
            echo "No Render deploy hook configured, skipping"
          fi

      - name: Deploy notification
        run: |
          echo "🚀 Staging deployment triggered"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Frontend: Vercel deployment initiated"
          echo "Backend: Render deploy hook triggered"

  production-smoke:
    name: Stage 7 - Production Smoke
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install Playwright browsers
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: Run production connectivity smoke tests
        working-directory: .
        run: >
          npx playwright test -c playwright.all.config.ts
          tests/smoke/production-connectivity.spec.ts
          --project=chromium
          --grep "@production"
        env:
          CI: true
          PRODUCTION_FRONTEND_URL: https://v2-ecosystem.vercel.app
          PRODUCTION_API_URL: https://v2-ecosystem-backend.onrender.com

      - name: Upload production smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
