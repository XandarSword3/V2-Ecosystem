name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

env:
  NODE_VERSION: '20.x'

jobs:
  quality-gate:
    name: Stage 1 - Quality Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit
      
      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

  backend-unit:
    name: Stage 2 - Backend Unit
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Run unit tests
        working-directory: backend
        run: npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key
      
      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend-unit:
    name: Stage 2 - Frontend Unit
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run unit tests
        working-directory: frontend
        run: npm test
        env:
          NODE_ENV: test

      - name: Run critical route coverage gate
        working-directory: frontend
        run: npm run test:cov:critical
        env:
          NODE_ENV: test

      - name: Upload frontend coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
            frontend/coverage-critical/
          retention-days: 7

  backend-integration:
    name: Stage 3 - Backend Integration
    runs-on: ubuntu-latest
    needs: backend-unit
    services:
      postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: v2resort_test
          POSTGRES_PASSWORD: v2resort_test_secret
          POSTGRES_DB: v2resort_test
        ports:
          - 5433:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U v2resort_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis-test:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgrest-test:
        image: postgrest/postgrest:v12.2.8
        env:
          PGRST_DB_URI: postgres://v2resort_test:v2resort_test_secret@postgres-test:5432/v2resort_test
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: v2resort_test
          PGRST_JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters
          PGRST_SERVER_PORT: 3000
        ports:
          - 3007:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters
          DATABASE_URL: postgresql://v2resort_test:v2resort_test_secret@127.0.0.1:5433/v2resort_test
          TEST_DATABASE_URL: postgresql://v2resort_test:v2resort_test_secret@127.0.0.1:5433/v2resort_test
          REDIS_URL: redis://127.0.0.1:6380
          TEST_REDIS_URL: redis://127.0.0.1:6380
          SUPABASE_URL: http://127.0.0.1:3007
          SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiaWF0IjoxNzM1Njg5NjAwLCJpc3MiOiJzdXBhYmFzZSIsImV4cCI6MjA1MTIyMjQwMCwicm9sZSI6InNlcnZpY2Vfcm9sZSJ9.m90MoaLqExSiHL6aqM6qN8NNO8gpym-QpOW1hRTEgbA
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiaWF0IjoxNzM1Njg5NjAwLCJpc3MiOiJzdXBhYmFzZSIsImV4cCI6MjA1MTIyMjQwMCwicm9sZSI6ImFub24ifQ.n41diJVAoCbfggtbtNWQ0DpOx1XO2MXBM06EfBlCJ2w

      - name: Upload integration results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results
          path: backend/test-results/
          retention-days: 7

  build:
    name: Stage 4 - Build
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: Build backend
        working-directory: backend
        run: npm run build
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  e2e-smoke:
    name: Stage 5 - E2E Smoke
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: .
        run: npx playwright install --with-deps chromium
      
      - name: Start backend and frontend
        working-directory: .
        run: |
          npm run dev > /tmp/v2-resort-dev.log 2>&1 &
          echo "Started app services"

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1 && curl -fsS http://localhost:3005/api/healthz >/dev/null 2>&1; then
              echo "Services are up"
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time"
          cat /tmp/v2-resort-dev.log || true
          exit 1

      - name: Run smoke Playwright tests
        working-directory: .
        run: npx playwright test -c playwright.all.config.ts --project=chromium --grep "@smoke"
        env:
          CI: true
          E2E_CUSTOMER_EMAIL: e2e.customer@test.com
          E2E_CUSTOMER_PASSWORD: TestPass123!
          E2E_ADMIN_EMAIL: admin@v2resort.com
          E2E_ADMIN_PASSWORD: admin123
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-phase3:
    name: Stage 5.5 - Phase 3 Coverage
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: Start backend and frontend
        working-directory: .
        run: |
          npm run dev > /tmp/v2-resort-dev.log 2>&1 &
          echo "Started app services"

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1 && curl -fsS http://localhost:3005/api/healthz >/dev/null 2>&1; then
              echo "Services are up"
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time"
          cat /tmp/v2-resort-dev.log || true
          exit 1

      - name: Run Phase 3 critical-path specs (PR)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: >
          npx playwright test -c playwright.config.ts
          tests/phase3/00-public-pages.spec.ts
          tests/phase3/01-engine-a-instant-transactions.spec.ts
          tests/phase3/02-engine-b-reservations.spec.ts
          tests/phase3/03-engine-c-capacity.spec.ts
          tests/phase3/04-engine-d-entitlements.spec.ts
          tests/phase3/24-journey-cross-engine.spec.ts
          --project=chromium
        env:
          CI: true

      - name: Run full Phase 3 suite (Nightly/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: npx playwright test -c playwright.config.ts --project=chromium
        env:
          CI: true

      - name: Upload Phase 3 artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-phase3-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-full-nightly:
    name: Stage 6 - Full E2E (Main/Nightly)
    runs-on: ubuntu-latest
    needs: [build, backend-integration]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        working-directory: .
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: Start backend and frontend
        working-directory: .
        run: |
          npm run dev > /tmp/v2-resort-dev.log 2>&1 &
          echo "Started app services"

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1 && curl -fsS http://localhost:3005/api/healthz >/dev/null 2>&1; then
              echo "Services are up"
              exit 0
            fi
            sleep 5
          done
          echo "Services did not become ready in time"
          cat /tmp/v2-resort-dev.log || true
          exit 1

      - name: Run full Playwright suite
        working-directory: .
        run: npx playwright test -c playwright.all.config.ts --project=chromium
        env:
          CI: true

      - name: Upload full E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-full-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, backend-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy frontend to Vercel (staging)
        working-directory: frontend
        continue-on-error: true
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN not set in runner environment, skipping Vercel deploy"
            exit 0
          fi
          vercel deploy --token="$VERCEL_TOKEN" --confirm

      - name: Deploy backend to Render
        continue-on-error: true
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK:-}" ]; then
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deploy hook triggered"
          else
            echo "No Render deploy hook configured, skipping"
          fi

      - name: Deploy notification
        run: |
          echo "🚀 Staging deployment triggered"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Frontend: Vercel deployment initiated"
          echo "Backend: Render deploy hook triggered"
