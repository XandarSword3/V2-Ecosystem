name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Please check existing issues and discussions before submitting.

  - type: dropdown
    id: workspace
    attributes:
      label: Which workspace does this affect?
      options:
        - Backend (API / server)
        - Frontend (web app)
        - Mobile (Expo app)
        - Database / schema
        - Multiple workspaces
        - Infrastructure / CI
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Why does it matter?
      placeholder: "Currently, when I try to... there is no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you have thought about?

  - type: dropdown
    id: priority
    attributes:
      label: Priority (your assessment)
      options:
        - Critical (blocks core functionality)
        - High (significantly improves workflow)
        - Medium (nice to have)
        - Low (minor improvement)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references, or anything else relevant.
