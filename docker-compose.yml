# Local full-stack compose for Postgres + Redis + API + frontend development.
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: v2-ecosystem-db
    environment:
      POSTGRES_USER: ${DB_USER:-v2ecosystem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-v2ecosystem_secret}
      POSTGRES_DB: ${DB_NAME:-v2ecosystem}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-v2ecosystem}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - v2-network

  redis:
    image: redis:7-alpine
    container_name: v2-ecosystem-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - v2-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: v2-ecosystem-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-v2ecosystem}:${DB_PASSWORD:-v2ecosystem_secret}@postgres:5432/${DB_NAME:-v2ecosystem}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - v2-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: v2-ecosystem-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - v2-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: v2-ecosystem-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - v2-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  v2-network:
    driver: bridge
